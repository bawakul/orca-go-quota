# CI: the checks that pass on a fresh clone with nothing but Node. The full suite
# (`orca plugin test .`) and the typecheck both need Orca's generated typings
# (`.orca/types/`, gitignored, produced by `orca plugin types` locally), so they
# stay desk-side; this workflow runs the pure half of the suite, which is the
# stranger's quick trust signal.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pure tests
        run: node --test src/usage.test.ts
